version: "3.9"

services:
  web:
    # `image:` lets prod hosts run `docker compose pull && up -d` against the
    # registry tag pushed by CD, without needing the source tree at all.
    # Local dev instead runs `docker compose build` to build+tag it locally.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-ghcr.io/OWNER/dharan-explorer:latest}
    container_name: dharan-explorer-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - webnet

  # ---- Optional observability stack: `docker compose --profile monitoring up -d`
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: dharan-explorer-nginx-exporter
    command:
      - -nginx.scrape-uri=http://web:8080/nginx_status
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - webnet
    profiles: ["monitoring"]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: dharan-explorer-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter
    networks:
      - webnet
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dharan-explorer-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dharan-explorer.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - webnet
    profiles: ["monitoring"]

networks:
  webnet:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
